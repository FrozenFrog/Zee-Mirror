services:
  zee-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zee-mirror-bot
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${DASHBOARD_PORT:-80}:5248"

    # Settings come from .env (copy .env.example) and are saved to the
    # `settings` table on start, encrypted where secret. Once saved, .env can
    # shrink to DB_DRIVER (+ DATABASE_URL for postgres), ENCRYPTION_KEY and
    # the dashboard sign-in (WEB_DASHBOARD_TOKEN or OIDC_*). The local
    # Telegram Bot API server is bundled in the image and started by the bot.
    env_file:
      - path: .env
        required: false
    # DB_DRIVER defaults to sqlite (CONFIG_DIR/zee-mirror.db, i.e. ./config).
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (openssl rand -hex 32)}

    volumes:
      - downloads:/app/downloads
      - ./config:/app/config
      - data:/app/data
      - telegram-data:/var/lib/telegram-bot-api

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

volumes:
  downloads:
  telegram-data:
  data:
