services:
  zee-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zee-mirror-bot
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${DASHBOARD_PORT:-80}:5248"

    # Every other setting (bot token, owner, rclone config, cookies, ...) is
    # read from the `settings` table of this database. The local Telegram Bot
    # API server is bundled in the image and started by the bot.
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}

    volumes:
      - downloads:/app/downloads
      - ./config:/app/config
      - data:/app/data
      - telegram-data:/var/lib/telegram-bot-api

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

volumes:
  downloads:
  telegram-data:
  data:
