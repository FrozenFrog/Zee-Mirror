apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zee-mirror.fullname" . }}-secret
  labels:
    {{- include "zee-mirror.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ required "config.encryptionKey is required" .Values.config.encryptionKey | quote }}
  BOT_TOKEN: {{ .Values.config.botToken | quote }}
  OWNER_ID: {{ .Values.config.ownerID | quote }}
  WEB_DASHBOARD_TOKEN: {{ .Values.config.dashboardToken | quote }}
  OIDC_ISSUER: {{ .Values.config.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.config.oidc.clientID | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.config.oidc.clientSecret | quote }}
  OIDC_REDIRECT_URL: {{ .Values.config.oidc.redirectURL | quote }}
  OIDC_ALLOWED_GROUPS: {{ .Values.config.oidc.allowedGroups | quote }}
  DATABASE_URL: {{ .Values.config.databaseURL | quote }}
  SENTRY_DSN: {{ .Values.config.sentryDSN | quote }}
