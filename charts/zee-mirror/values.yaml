replicaCount: 1

image:
  repository: ghcr.io/ifauzeee/zee-mirror
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 5248

ingress:
  enabled: true
  className: nginx
  host: mirror.example.com
  tls:
    enabled: true
    secretName: zee-mirror-tls

config:
  botToken: ""
  ownerID: ""
  # Web dashboard sign-in through OpenID Connect (e.g. Pocket-ID).
  oidc:
    issuer: ""
    clientID: ""
    clientSecret: ""
    redirectURL: ""     # default: <WEB_DASHBOARD_URL>/api/auth/oidc/callback
    allowedGroups: ""   # comma separated, empty = any group
  logLevel: info
  logFormat: json
  rcloneDest: "gdrive:/Zee-Mirror"
  rcloneConf: ""
  downloadDir: /app/downloads
  configDir: /app/config
  dbDriver: postgres
  databaseURL: ""
  redisURL: ""
  sentryDSN: ""
  maxConcurrentDownloads: 3
  stopDuplicate: false

persistence:
  enabled: true
  size: 50Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: 2

nodeSelector: {}
tolerations: []
affinity: {}
