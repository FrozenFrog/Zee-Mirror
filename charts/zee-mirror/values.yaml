replicaCount: 1

image:
  repository: ghcr.io/ifauzeee/zee-mirror
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 5248

ingress:
  enabled: true
  className: nginx
  host: mirror.example.com
  tls:
    enabled: true
    secretName: zee-mirror-tls

config:
  # Required: 64 hex chars (openssl rand -hex 32). Encrypts secrets in the
  # settings table and signs dashboard sessions.
  encryptionKey: ""
  # Everything below is saved to the settings table on start; values left
  # empty are taken from the database.
  botToken: ""
  ownerID: ""
  # Web dashboard sign-in: dashboardToken (16+ chars), OIDC, or both.
  dashboardToken: ""
  oidc:
    issuer: ""
    clientID: ""
    clientSecret: ""
    redirectURL: ""     # default: <WEB_DASHBOARD_URL>/api/auth/oidc/callback
    allowedGroups: ""   # comma separated, required for OIDC sign-in
  logLevel: info
  logFormat: json
  rcloneDest: "gdrive:/Zee-Mirror"
  rcloneConf: ""
  downloadDir: /app/downloads
  configDir: /app/config
  # sqlite (default, stored in configDir) or postgres (needs databaseURL).
  dbDriver: ""
  databaseURL: ""
  sentryDSN: ""
  maxConcurrentDownloads: 3
  stopDuplicate: false

persistence:
  enabled: true
  size: 50Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: 2

nodeSelector: {}
tolerations: []
affinity: {}
